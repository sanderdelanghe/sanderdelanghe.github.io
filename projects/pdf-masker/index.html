<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Upload a PDF and reveal hidden words one click at a time." />
  <title>PDF Masker</title>

  <!-- PDF.js core viewer styles for text layer alignment -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- ===== Toolbar ===== -->
  <nav id="toolbar">
    <div class="toolbar-brand">
      <div class="logo-box" title="PDF Masker">PDF</div>
    </div>

    <div id="page-info"></div>

    <div id="toolbar-controls">
      <button class="toolbar-btn accent" id="change-file-btn" title="Upload a different PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        <span>New File</span>
      </button>
    </div>
  </nav>

  <!-- ===== Main Content ===== -->
  <main>

    <!-- Upload Section -->
    <section id="upload-section">
      <div id="upload-zone" tabindex="0" role="button" aria-label="Upload PDF file">
        <h2>Drop PDF Here</h2>
        <p>Or click to browse</p>
      </div>
      <input type="file" id="file-input" accept=".pdf,application/pdf" hidden />
    </section>

    <!-- Loading Section -->
    <section id="loading-section" class="hidden">
      <div class="spinner"></div>
      <p class="loading-text">Processing your PDF…</p>
    </section>

    <!-- Viewer Section -->
    <section id="viewer-section" class="hidden">
      <div id="viewer"></div>
    </section>

  </main>

  <!-- PDF.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script src="js/app.js"></script>
</body>

</html>
